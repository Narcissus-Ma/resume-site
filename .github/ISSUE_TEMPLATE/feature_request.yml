name: Feature request
description: 提出新功能或改进建议 / Suggest a new feature or improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 需求背景 / Problem or use case
      description: 说明要解决的问题、使用场景及受影响的用户。 / Explain the problem, use case, and affected users.
      placeholder: 请说明当前痛点和使用场景。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望的方案 / Proposed solution
      description: 描述你期望的功能或改进方式。 / Describe the feature or improvement you would like.
      placeholder: 请说明建议的实现效果或交互方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 说明已考虑的其他方案或临时绕过方式。 / Describe alternatives or workarounds you considered.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认 / Submission checklist
      options:
        - label: 我已搜索现有 Issue / I searched existing issues
          required: true
        - label: 不含密码、密钥、Token 或生产配置 / No credentials, secrets, tokens, or production configuration are included
          required: true
